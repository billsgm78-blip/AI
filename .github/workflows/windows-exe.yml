name: Build Windows Jarvis
on:
  workflow_dispatch:
  push:
    paths: ["desktop/**", ".github/workflows/windows-exe.yml"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller httpx pyautogui
      - run: pyinstaller --onefile --name JarvisAgent desktop/agent.py
      - uses: actions/upload-artifact@v4
        with:
          name: JarvisAgent-windows
          path: dist/JarvisAgent.exe
