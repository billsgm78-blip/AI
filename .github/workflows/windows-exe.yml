name: Build Windows Jarvis
on:
  workflow_dispatch:
  push:
    paths: ["desktop/**", ".github/workflows/windows-exe.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller httpx pyautogui
      - run: pyinstaller --onefile --name JarvisAgent desktop/agent.py
      - uses: actions/upload-artifact@v4
        with:
          name: JarvisAgent-windows
          path: dist/JarvisAgent.exe
      - name: Publish permanent download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create latest dist/JarvisAgent.exe --title "Jarvis for Windows" --notes "Windows companion for Jarvis." --target "$GITHUB_SHA" --latest || gh release upload latest dist/JarvisAgent.exe --clobber
