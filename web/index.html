<!doctype html><html lang="uz"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jarvis</title><style>
*{box-sizing:border-box}body{margin:0;background:#080d18;color:#eef3ff;font:16px system-ui;min-height:100dvh;display:grid;place-items:center}.app{width:min(760px,100%);height:100dvh;max-height:900px;display:flex;flex-direction:column;background:#0d1422;border:1px solid #26334a;border-radius:20px;overflow:hidden}.top{padding:18px 22px;border-bottom:1px solid #26334a;display:flex;justify-content:space-between}.top b{font-size:20px}.feed{padding:20px;overflow:auto;flex:1}.msg{white-space:pre-wrap;margin:10px 0;padding:14px 16px;border-radius:16px;max-width:90%;background:#172236}.me{margin-left:auto;background:#244b91}.actions{padding:0 20px}.bar{display:flex;padding:14px;gap:10px;border-top:1px solid #26334a}input,button{font:inherit;border:0;border-radius:12px;padding:13px}input{flex:1;min-width:0;background:#172236;color:white}button{background:#477fff;color:white;cursor:pointer}button.alt{background:#394968;margin:4px}.small{font-size:12px;color:#aab8d0}@media(max-width:600px){.app{border:0;border-radius:0}}
</style><div class="app"><header class="top"><b>✦ JARVIS</b><span class="small">Shaxsiy yordamchi</span></header><main id="feed" class="feed"><div class="msg">Salom! Men Jarvisman. Internetdan qidirish yoki kompyuteringizda amal bajarishni so‘rang.</div></main><section id="actions" class="actions"></section><form id="form" class="bar"><input id="text" placeholder="Jarvisga yozing…" autocomplete="off"><button>Yuborish</button><button type="button" id="mic" class="alt">🎙️</button></form></div><script>
const feed=document.querySelector('#feed'),input=document.querySelector('#text'),actions=document.querySelector('#actions');let token=localStorage.jarvisToken||prompt('Shaxsiy kirish kaliti');if(token){localStorage.jarvisToken=token}
function bubble(t,me=false){let d=document.createElement('div');d.className='msg'+(me?' me':'');d.textContent=t;feed.append(d);feed.scrollTop=feed.scrollHeight}
async function send(t){if(!t.trim())return;bubble(t,true);input.value='';let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({message:t})});let d=await r.json();bubble(d.reply||d.detail||'Xatolik');for(let x of d.pending||[]){let b=document.createElement('button');b.className='alt';b.textContent='Tasdiqlash: '+x.action+' — '+x.value;b.onclick=async()=>{await fetch('/api/desktop/'+x.id,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({approved:true})});b.remove();bubble('Kompyuterga yuborildi.')};actions.append(b)}}
document.querySelector('#form').onsubmit=e=>{e.preventDefault();send(input.value)};document.querySelector('#mic').onclick=()=>{let S=window.SpeechRecognition||window.webkitSpeechRecognition;if(!S)return bubble('Ovozli kiritish brauzeringizda qo‘llanmaydi.');let s=new S();s.lang='uz-UZ';s.onresult=e=>send(e.results[0][0].transcript);s.start()};
</script></html>
